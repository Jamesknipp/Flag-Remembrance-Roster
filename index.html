<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Army Aviation Memorial Roster</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #0b1020;
      color: #f5f5f5;
    }
    header {
      padding: 16px 24px;
      background: #11172b;
      border-bottom: 1px solid #222a3f;
    }
    header h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.05em;
    }
    header p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: #a9b3d1;
    }
    main {
      padding: 16px 24px 32px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background: #141a30;
      border: 1px solid #222a3f;
      border-radius: 8px;
      padding: 16px 18px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #d0dcff;
    }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat-pill {
      background: #1b2340;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: #c3cff5;
      border: 1px solid #2b3558;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filters input,
    .filters select {
      background: #0f1424;
      border: 1px solid #2b3558;
      border-radius: 4px;
      padding: 6px 8px;
      color: #e5ebff;
      font-size: 0.85rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #222a3f;
    }
    th {
      text-align: left;
      font-weight: 600;
      color: #c3cff5;
      background: #161d36;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tr:nth-child(even) td {
      background: #10162a;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid #3b476e;
    }
    .badge-kia {
      color: #ffb3b3;
      border-color: #ff5c5c;
    }
    .badge-living {
      color: #b3ffd0;
      border-color: #4fd38f;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
    label {
      font-size: 0.8rem;
      color: #a9b3d1;
      display: block;
      margin-bottom: 3px;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0f1424;
      border: 1px solid #2b3558;
      border-radius: 4px;
      padding: 6px 8px;
      color: #e5ebff;
      font-size: 0.85rem;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    button {
      background: #2f6bff;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      color: #f5f5f5;
      font-size: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    button:hover {
      background: #2554c7;
    }
    .secondary-btn {
      background: #1b2340;
      border: 1px solid #2b3558;
    }
    .secondary-btn:hover {
      background: #222b4a;
    }
    .qr-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .qr-preview canvas {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
    }
    .small-text {
      font-size: 0.75rem;
      color: #a9b3d1;
    }
    .row-actions {
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Army Aviation Memorial Roster</h1>
    <p>Flag dedications, aviator roll, and QR-linked memorial pages.</p>
  </header>

  <main>
    <div class="layout">
      <!-- Left: Roster -->
      <section class="card">
        <h2>Roster</h2>

        <div class="stats-bar" id="statsBar">
          <!-- Filled by JS -->
        </div>

        <div class="filters">
          <input type="text" id="filterName" placeholder="Filter by name…" />
          <select id="filterStatus">
            <option value="">Status: All</option>
            <option value="KIA">KIA</option>
            <option value="Living">Living</option>
          </select>
          <select id="filterComponent">
            <option value="">Component: All</option>
            <option value="Active">Active</option>
            <option value="Guard">Guard</option>
            <option value="Reserve">Reserve</option>
          </select>
        </div>

        <div style="max-height: 380px; overflow: auto; border-radius: 6px; border: 1px solid #222a3f;">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Unit / Component</th>
                <th>Status</th>
                <th>QR</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rosterBody">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Right: Form + QR -->
      <section class="card">
        <h2>Submit an Aviator</h2>

        <form id="aviatorForm">
          <div class="form-grid">
            <div>
              <label for="aviatorName">Aviator name</label>
              <input id="aviatorName" required />
            </div>
            <div>
              <label for="unit">Unit / battalion</label>
              <input id="unit" />
            </div>
            <div>
              <label for="component">Component</label>
              <select id="component">
                <option value="">Select…</option>
                <option value="Active">Active</option>
                <option value="Guard">Guard</option>
                <option value="Reserve">Reserve</option>
              </select>
            </div>
            <div>
              <label for="status">Status</label>
              <select id="status">
                <option value="Living">Living</option>
                <option value="KIA">KIA</option>
              </select>
            </div>
          </div>

          <label for="dedicationUrl">Dedication URL (your memorial page link)</label>
          <input id="dedicationUrl" placeholder="https://…" />

          <label for="notes">Notes (aircraft, era, remarks)</label>
          <textarea id="notes"></textarea>

          <div class="qr-preview">
            <div id="qrCanvasContainer"></div>
            <span class="small-text">
              QR is generated from the dedication URL. Use this for engraving or printing.
            </span>
          </div>

          <div style="margin-top: 10px; display: flex; gap: 8px;">
            <button type="submit">Add to roster</button>
            <button type="button" class="secondary-btn" id="previewQrBtn">
              Preview QR
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- QR library (lightweight) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <script>
    // --- Data handling ---
    const STORAGE_KEY = "aviation_memorial_roster_v1";

    function loadRoster() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        return JSON.parse(raw);
      } catch (e) {
        console.error("Failed to parse roster", e);
        return [];
      }
    }

    function saveRoster(roster) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(roster));
    }

    let roster = loadRoster();

    // Seed example if empty
    if (roster.length === 0) {
      roster = [
        {
          id: crypto.randomUUID(),
          name: "CW4 John Doe",
          unit: "1-14 AVN",
          component: "Active",
          status: "KIA",
          dedicationUrl: "https://example.com/john-doe",
          notes: "Vietnam-era Army Aviator, memorial flag dedication."
        },
        {
          id: crypto.randomUUID(),
          name: "CW3 Jane Smith",
          unit: "AL ARNG AVN",
          component: "Guard",
          status: "Living",
          dedicationUrl: "https://example.com/jane-smith",
          notes: "Alabama Army National Guard aviator."
        }
      ];
      saveRoster(roster);
    }

    // --- Rendering ---
    const rosterBody = document.getElementById("rosterBody");
    const statsBar = document.getElementById("statsBar");

    const filterName = document.getElementById("filterName");
    const filterStatus = document.getElementById("filterStatus");
    const filterComponent = document.getElementById("filterComponent");

    function computeStats(list) {
      const total = list.length;
      const kia = list.filter(a => a.status === "KIA").length;
      const living = list.filter(a => a.status === "Living").length;
      const guard = list.filter(a => a.component === "Guard").length;
      const active = list.filter(a => a.component === "Active").length;
      const reserve = list.filter(a => a.component === "Reserve").length;
      return { total, kia, living, guard, active, reserve };
    }

    function renderStats(list) {
      const s = computeStats(list);
      statsBar.innerHTML = `
        <span class="stat-pill">Total: ${s.total}</span>
        <span class="stat-pill">KIA: ${s.kia}</span>
        <span class="stat-pill">Living: ${s.living}</span>
        <span class="stat-pill">Active: ${s.active}</span>
        <span class="stat-pill">Guard: ${s.guard}</span>
        <span class="stat-pill">Reserve: ${s.reserve}</span>
      `;
    }

    function applyFilters(list) {
      const nameVal = filterName.value.trim().toLowerCase();
      const statusVal = filterStatus.value;
      const compVal = filterComponent.value;

      return list.filter(a => {
        if (nameVal && !a.name.toLowerCase().includes(nameVal)) return false;
        if (statusVal && a.status !== statusVal) return false;
        if (compVal && a.component !== compVal) return false;
        return true;
      });
    }

    function renderRoster() {
      const filtered = applyFilters(roster);
      renderStats(filtered);

      rosterBody.innerHTML = "";
      filtered.forEach(a => {
        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        tdName.textContent = a.name;

        const tdUnit = document.createElement("td");
        tdUnit.textContent = `${a.unit || "—"}${a.component ? " (" + a.component + ")" : ""}`;

        const tdStatus = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = "badge " + (a.status === "KIA" ? "badge-kia" : "badge-living");
        badge.textContent = a.status;
        tdStatus.appendChild(badge);

        const tdQr = document.createElement("td");
        if (a.dedicationUrl) {
          const link = document.createElement("a");
          link.href = a.dedicationUrl;
          link.target = "_blank";
          link.textContent = "Open";
          tdQr.appendChild(link);
        } else {
          tdQr.textContent = "—";
        }

        const tdActions = document.createElement("td");
        const actionsDiv = document.createElement("div");
        actionsDiv.className = "row-actions";

        const qrBtn = document.createElement("button");
        qrBtn.type = "button";
        qrBtn.className = "secondary-btn";
        qrBtn.textContent = "QR";
        qrBtn.onclick = () => showQrForAviator(a);

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "secondary-btn";
        delBtn.textContent = "Delete";
        delBtn.onclick = () => deleteAviator(a.id);

        actionsDiv.appendChild(qrBtn);
        actionsDiv.appendChild(delBtn);
        tdActions.appendChild(actionsDiv);

        tr.appendChild(tdName);
        tr.appendChild(tdUnit);
        tr.appendChild(tdStatus);
        tr.appendChild(tdQr);
        tr.appendChild(tdActions);

        rosterBody.appendChild(tr);
      });
    }

    function deleteAviator(id) {
      roster = roster.filter(a => a.id !== id);
      saveRoster(roster);
      renderRoster();
    }

    // --- QR handling ---
    const qrCanvasContainer = document.getElementById("qrCanvasContainer");
    let qrInstance = null;

    function ensureQrInstance() {
      if (!qrInstance) {
        const canvas = document.createElement("canvas");
        qrCanvasContainer.innerHTML = "";
        qrCanvasContainer.appendChild(canvas);
        qrInstance = new QRious({
          element: canvas,
          size: 180,
          level: "H"
        });
      }
      return qrInstance;
    }

    function updateQrFromUrl(url) {
      const qr = ensureQrInstance();
      qr.value = url || "https://example.com";
    }

    function showQrForAviator(a) {
      if (!a.dedicationUrl) {
        alert("This aviator has no dedication URL set.");
        return;
      }
      updateQrFromUrl(a.dedicationUrl);
    }

    // --- Form handling ---
    const aviatorForm = document.getElementById("aviatorForm");
    const previewQrBtn = document.getElementById("previewQrBtn");
    const dedicationUrlInput = document.getElementById("dedicationUrl");

    previewQrBtn.addEventListener("click", () => {
      const url = dedicationUrlInput.value.trim();
      if (!url) {
        alert("Enter a dedication URL first.");
        return;
      }
      updateQrFromUrl(url);
    });

    aviatorForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("aviatorName").value.trim();
      const unit = document.getElementById("unit").value.trim();
      const component = document.getElementById("component").value || "";
      const status = document.getElementById("status").value || "Living";
      const dedicationUrl = dedicationUrlInput.value.trim();
      const notes = document.getElementById("notes").value.trim();

      if (!name) {
        alert("Name is required.");
        return;
      }

      const newAviator = {
        id: crypto.randomUUID(),
        name,
        unit,
        component,
        status,
        dedicationUrl,
        notes
      };

      roster.push(newAviator);
      saveRoster(roster);
      renderRoster();

      aviatorForm.reset();
      qrCanvasContainer.innerHTML = "";
      qrInstance = null;
    });

    // --- Filters events ---
    [filterName, filterStatus, filterComponent].forEach(el => {
      el.addEventListener("input", renderRoster);
      el.addEventListener("change", renderRoster);
    });

    // Initial render
    renderRoster();
  </script>
</body>
</html>
