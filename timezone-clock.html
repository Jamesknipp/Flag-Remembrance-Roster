<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Timezone Digital Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5rem;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.6);
      letter-spacing: 2px;
    }

    .controls {
      text-align: center;
      margin-bottom: 30px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .controls input,
    .controls select,
    .controls button {
      padding: 10px 15px;
      border-radius: 8px;
      border: 2px solid #64c8ff;
      background: rgba(10, 10, 30, 0.8);
      color: #64c8ff;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .controls input:focus,
    .controls select:focus {
      outline: none;
      box-shadow: 0 0 15px rgba(100, 200, 255, 0.8);
      background: rgba(20, 20, 40, 0.9);
    }

    .controls button {
      background: linear-gradient(135deg, #64c8ff, #4fa8d8);
      color: #0f0f23;
      font-weight: bold;
      border: none;
    }

    .controls button:hover {
      box-shadow: 0 0 20px rgba(100, 200, 255, 0.8);
      transform: scale(1.05);
    }

    .clocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .clock-card {
      background: rgba(20, 30, 60, 0.6);
      border: 2px solid #64c8ff;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(100, 200, 255, 0.15);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .clock-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .clock-card:hover {
      box-shadow: 0 8px 32px rgba(100, 200, 255, 0.4);
      transform: translateY(-5px);
      border-color: #64c8ff;
    }

    .clock-card:hover::before {
      left: 100%;
    }

    .timezone-name {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #64c8ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .time-display {
      font-size: 2.8rem;
      font-weight: bold;
      margin: 20px 0;
      color: #fff;
      text-shadow: 0 0 10px rgba(100, 200, 255, 0.8);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    .date-display {
      font-size: 0.95rem;
      color: #a0c8ff;
      margin-bottom: 8px;
    }

    .utc-offset {
      font-size: 0.85rem;
      color: #7eb8ff;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(100, 200, 255, 0.3);
    }

    .remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 100, 100, 0.8);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
    }

    .clock-card:hover .remove-btn {
      opacity: 1;
    }

    .remove-btn:hover {
      background: rgba(255, 50, 50, 1);
      transform: scale(1.1);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #7eb8ff;
      font-size: 1.1rem;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #7eb8ff;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      .clocks-grid {
        grid-template-columns: 1fr;
      }

      .time-display {
        font-size: 2.2rem;
      }

      .controls {
        flex-direction: column;
      }

      .controls input,
      .controls select,
      .controls button {
        width: 100%;
      }
    }

    /* Animation for new clocks */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .clock-card.new {
      animation: slideIn 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏰ Multi-Timezone Clock</h1>

    <div class="controls">
      <select id="timezoneSelect">
        <option value="">Select a timezone...</option>
        <option value="America/New_York">Eastern Time (ET)</option>
        <option value="America/Chicago">Central Time (CT)</option>
        <option value="America/Denver">Mountain Time (MT)</option>
        <option value="America/Los_Angeles">Pacific Time (PT)</option>
        <option value="America/Anchorage">Alaska Time</option>
        <option value="Pacific/Honolulu">Hawaii Time</option>
        <option value="Europe/London">London (GMT)</option>
        <option value="Europe/Paris">Paris (CET)</option>
        <option value="Europe/Berlin">Berlin (CET)</option>
        <option value="Europe/Moscow">Moscow (MSK)</option>
        <option value="Asia/Dubai">Dubai (GST)</option>
        <option value="Asia/Kolkata">India (IST)</option>
        <option value="Asia/Bangkok">Bangkok (ICT)</option>
        <option value="Asia/Shanghai">Shanghai (CST)</option>
        <option value="Asia/Tokyo">Tokyo (JST)</option>
        <option value="Asia/Seoul">Seoul (KST)</option>
        <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
        <option value="Asia/Singapore">Singapore (SGT)</option>
        <option value="Australia/Sydney">Sydney (AEDT)</option>
        <option value="Australia/Melbourne">Melbourne (AEDT)</option>
        <option value="Pacific/Auckland">Auckland (NZDT)</option>
        <option value="UTC">UTC</option>
      </select>
      <button onclick="addTimezone()">Add Timezone</button>
      <button onclick="clearAll()" style="background: linear-gradient(135deg, #ff6464, #d84848);">Clear All</button>
    </div>

    <div class="clocks-grid" id="clocksGrid"></div>

    <div class="empty-state" id="emptyState">
      Select a timezone and click "Add Timezone" to get started.
    </div>

    <div class="footer">
      <p>🌍 All times update in real-time • Data stored locally in your browser</p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'timezone_clocks_v1';
    let timezones = [];

    // Load timezones from localStorage
    function loadTimezones() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        timezones = saved ? JSON.parse(saved) : [];
      } catch (e) {
        timezones = [];
      }
    }

    // Save timezones to localStorage
    function saveTimezones() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(timezones));
    }

    // Add a new timezone
    function addTimezone() {
      const select = document.getElementById('timezoneSelect');
      const tz = select.value;

      if (!tz) {
        alert('Please select a timezone first.');
        return;
      }

      if (timezones.includes(tz)) {
        alert('This timezone is already added.');
        return;
      }

      timezones.push(tz);
      saveTimezones();
      select.value = '';
      renderClocks();
    }

    // Remove a timezone
    function removeTimezone(tz) {
      timezones = timezones.filter(t => t !== tz);
      saveTimezones();
      renderClocks();
    }

    // Clear all timezones
    function clearAll() {
      if (confirm('Remove all timezone clocks?')) {
        timezones = [];
        saveTimezones();
        renderClocks();
      }
    }

    // Format time for a given timezone
    function getTimeInTimezone(tz) {
      const now = new Date();
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
        year: 'numeric',
        month: 'short',
        day: '2-digit',
      });

      const parts = formatter.formatToParts(now);
      const timeParts = {};
      parts.forEach(part => {
        timeParts[part.type] = part.value;
      });

      const time = `${timeParts.hour}:${timeParts.minute}:${timeParts.second}`;
      const date = `${timeParts.month} ${timeParts.day}, ${timeParts.year}`;

      // Calculate UTC offset
      const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
      const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
      const offset = (tzDate - utcDate) / (1000 * 60 * 60);
      const offsetHours = Math.floor(offset);
      const offsetMinutes = (offset % 1) * 60;
      const offsetStr = `UTC${offsetHours >= 0 ? '+' : ''}${offsetHours}:${String(Math.abs(offsetMinutes)).padStart(2, '0')}`;

      return { time, date, offset: offsetStr };
    }

    // Get timezone display name
    function getTimezoneName(tz) {
      return tz.replace(/_/g, ' ').split('/').pop();
    }

    // Render all clock cards
    function renderClocks() {
      const grid = document.getElementById('clocksGrid');
      const emptyState = document.getElementById('emptyState');

      if (timezones.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = timezones
        .map(tz => {
          const { time, date, offset } = getTimeInTimezone(tz);
          return `
            <div class="clock-card new">
              <button class="remove-btn" onclick="removeTimezone('${tz}')">✕</button>
              <div class="timezone-name">${getTimezoneName(tz)}</div>
              <div class="date-display">${date}</div>
              <div class="time-display">${time}</div>
              <div class="utc-offset">${offset}</div>
            </div>
          `;
        })
        .join('');
    }

    // Update all clocks every second
    function updateClocks() {
      const cards = document.querySelectorAll('.clock-card');
      cards.forEach((card, index) => {
        const tz = timezones[index];
        if (tz) {
          const { time, date, offset } = getTimeInTimezone(tz);
          card.querySelector('.time-display').textContent = time;
          card.querySelector('.date-display').textContent = date;
          card.querySelector('.utc-offset').textContent = offset;
        }
      });
    }

    // Initialize
    loadTimezones();
    renderClocks();
    setInterval(updateClocks, 1000);

    // Add some default timezones on first load
    if (timezones.length === 0) {
      timezones = ['America/New_York', 'Europe/London', 'Asia/Tokyo'];
      saveTimezones();
      renderClocks();
    }
  </script>
</body>
</html>
